[package]
name        = "bech32-nv"
version     = "0.1.0"
description = "BIP 173 bech32 and BIP 350 bech32m: the BCH checksum as a @value state fed five bits at a time, encode and decode into a buffer the caller already owns with the human-readable part answered as a range, the eight-to-five regrouping with and without padding, and segwit addresses as the one application module."
license     = "Apache-2.0"

# `experimental` because no program outside this repository has used the
# package yet, and the tests were written against the signatures rather
# than by a consumer.
stability   = "experimental"

# `core`: a polymod and a shift over characters the caller already
# holds.  No function declares an effect, nothing is read and nothing
# is written.
#
# It carries `tests/embedded_probe.nv`, which builds `bech32_core` and
# `bechbits` for a Cortex-M4 and checks five answers on it under QEMU.
# The consumer is a hardware wallet: the device that signs a
# transaction has to show the address, and it has neither a heap nor
# room for a second copy of the string.
#
# `tests/alloc_scan.sh` reads the emitted LLVM for the other half of
# that: all twenty-four functions of the two modules appear in the IR at
# `--opt=0` and none of them calls the allocator.
layer       = "core"

category    = "encoding"

tags        = ["bech32", "bech32m", "bip173", "bip350", "segwit", "bitcoin", "embedded", "no-alloc"]
repository  = "https://github.com/novolang/bech32-nv"
maintainers = ["novo-lang"]
novo        = ">= 0.13.0"

# A library: no `main`, so `novo pkg build` type-checks and
# effect-checks every module under `src/` and writes no binary.

[docs.pages]
"README.md" = "A checksum fed five bits at a time"

[dependencies]
# None, and bitstream-nv is the one a reader would expect to see here.
# bech32's regrouping is a fixed five bits against eight with at most
# two values out of every step, so a general variable-width bit reader
# would carry a width argument through the inner loop for no gain.  The
# embedded probe is also built from the package's own core modules and
# nothing they depend on, so a dependency would cost the device build.
